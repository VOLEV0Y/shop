{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAT - Магазин обуви</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header>
        <div class="header">
            <div class="logo-section">
                <div class="logo">
                    <img src="{% static 'images/logo.jpeg' %}" alt="Логотип BRAT">
                </div>
                <h1><a href="/" style="text-decoration: none; color: inherit;">BRAT</a></h1>
            </div>
            
            <div class="nav">
                <a href="/?gender=F">ЖЕНЩИНАМ</a>
                <a href="/?gender=M">МУЖЧИНАМ</a>
                <a href="/?gender=U">УНИСЕКС</a>
            </div>
            
            <div class="header-actions">
                <form class="search-form" method="get" action="/">
                    <input type="text" name="search" placeholder="Поиск обуви..." value="{{ request.GET.search }}">
                    <button type="submit" class="search-btn">Найти</button>
                </form>
                <a href="/cart/" class="cart">
                    <img src="{% static 'images/cart.png' %}" alt="Корзина" class="cart-icon">
                    КОРЗИНА ({{ cart_items_count }})
                </a>
            </div>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="footer">
            <div class="footer-content">
                <div class="footer-left">
                    <div class="footer-brand">BRAT</div>
                    <p>© 2025 Все права защищены</p>
                    <p>ООО «БРАТ продажа обуви»</p>
                </div>
                
                <div class="footer-center">
                    <p><strong>Контакты</strong></p>
                    <p>brat@gmail.com</p>
                    <p>+7 (499) 521-71-14</p>
                </div>
                
                <div class="footer-right">
                    <p><strong>Мы в соцсетях:</strong></p>
                    <div class="social-icons">
                        <div class="social-icon">
                            <img src="{% static 'images/watchap.png' %}" alt="WhatsApp">
                        </div>
                        <div class="social-icon">
                            <img src="{% static 'images/instagram.png' %}" alt="Instagram">
                        </div>
                        <div class="social-icon">
                            <img src="{% static 'images/telega.png' %}" alt="Telegram">
                        </div>
                    </div>
                    
                    <p style="margin-top: 20px;"><strong>Способы оплаты:</strong></p>
                    <div class="payment-icons">
                        <div class="payment-icon">
                            <img src="{% static 'images/viza.jpg' %}" alt="Visa">
                        </div>
                        <div class="payment-icon">
                            <img src="{% static 'images/master.png' %}" alt="MasterCard">
                        </div>
                        <div class="payment-icon">
                            <img src="{% static 'images/mir.jpg' %}" alt="Мир">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
