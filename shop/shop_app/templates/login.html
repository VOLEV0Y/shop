{% extends "main.html" %}
{% load static %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-title">BRAT</div>
        <p class="auth-subtitle">Войдите в свой аккаунт</p>

        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="/login/">
            {% csrf_token %}
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" placeholder="Введите логин" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Введите пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="auth-btn">ВОЙТИ</button>
        </form>

        <div class="divider"><hr><span>или</span><hr></div>

        <div class="auth-links">
            Нет аккаунта? <a href="/register/">Зарегистрироваться</a>
        </div>
    </div>
</div>
{% endblock %}
