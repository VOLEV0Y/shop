{% extends "main.html" %}
{% load static %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-title">BRAT</div>
        <p class="auth-subtitle">Создайте аккаунт</p>

        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="/register/">
            {% csrf_token %}
            <div class="form-group">
                <label>Логин <span style="color:red;">*</span></label>
                <input type="text" name="username" placeholder="Придумайте логин" required>
            </div>
            <div class="form-group">
                <label>Email <span style="color:red;">*</span></label>
                <input type="email" name="email" placeholder="Введите email" required>
            </div>
            <div class="form-group">
                <label>Имя</label>
                <input type="text" name="first_name" placeholder="Введите имя">
            </div>
            <div class="form-group">
                <label>Фамилия</label>
                <input type="text" name="last_name" placeholder="Введите фамилию">
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="text" name="phone" placeholder="+7 (999) 000-00-00">
            </div>
            <div class="form-group">
                <label>Пароль <span style="color:red;">*</span></label>
                <input type="password" name="password1" placeholder="Придумайте пароль" required>
            </div>
            <div class="form-group">
                <label>Повторите пароль <span style="color:red;">*</span></label>
                <input type="password" name="password2" placeholder="Повторите пароль" required>
            </div>
            <button type="submit" class="auth-btn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        </form>

        <div class="divider"><hr><span>или</span><hr></div>

        <div class="auth-links">
            Уже есть аккаунт? <a href="/login/">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
